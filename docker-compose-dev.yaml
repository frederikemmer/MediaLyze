services:
  medialyze:
    image: medialyze:local
    container_name: medialyze
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${HOST_PORT:-8080}:8080"
      # Direct transcode federation protocol and optional LAN discovery.
      - "${FEDERATION_HOST_PORT:-8091}:${MEDIALYZE_FEDERATION_PORT:-8091}/tcp"
      - "${FEDERATION_DISCOVERY_PORT:-43211}:${MEDIALYZE_FEDERATION_DISCOVERY_PORT:-43211}/udp"
    env_file:
      - .env
    environment:
      CONFIG_PATH: /config
      MEDIA_ROOT: /media
      MEDIALYZE_TRANSCODE_OUTPUT_ROOT: /transcode-output
      MEDIALYZE_FEDERATION_ENABLED: ${MEDIALYZE_FEDERATION_ENABLED:-true}
      MEDIALYZE_FEDERATION_HOST: ${MEDIALYZE_FEDERATION_HOST:-0.0.0.0}
      MEDIALYZE_FEDERATION_PORT: ${MEDIALYZE_FEDERATION_PORT:-8091}
      MEDIALYZE_FEDERATION_DISCOVERY_PORT: ${MEDIALYZE_FEDERATION_DISCOVERY_PORT:-43211}
      MEDIALYZE_FEDERATION_PASSCODE: ${MEDIALYZE_FEDERATION_PASSCODE:-}
      MEDIALYZE_FEDERATION_ADVERTISE_URLS: ${MEDIALYZE_FEDERATION_ADVERTISE_URLS:-}
      MEDIALYZE_FEDERATION_CHUNK_SIZE_BYTES: ${MEDIALYZE_FEDERATION_CHUNK_SIZE_BYTES:-1048576}
      MEDIALYZE_FEDERATION_TEMP_BUDGET_BYTES: ${MEDIALYZE_FEDERATION_TEMP_BUDGET_BYTES:-0}
      MEDIALYZE_FEDERATION_RESULT_RETENTION_HOURS: ${MEDIALYZE_FEDERATION_RESULT_RETENTION_HOURS:-24}
      MEDIALYZE_FEDERATION_REQUEST_TIMEOUT_SECONDS: ${MEDIALYZE_FEDERATION_REQUEST_TIMEOUT_SECONDS:-15}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
      TZ: ${TZ:-UTC}
    volumes:
      - medialyze_config:/config
      - ${MEDIA_ROOT:-./media}:/media:ro
      - ${TRANSCODE_OUTPUT_HOST_DIR:-./Transcode_Output}:/transcode-output:rw

volumes:
  medialyze_config:
    driver: local

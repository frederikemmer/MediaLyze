name: build and publish Docker images

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: write

concurrency:
  group: build-docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.build_context.outputs.channel }}
      image_name: ${{ steps.build_context.outputs.image_name }}
      release_exists: ${{ steps.release_state.outputs.release_exists }}
      should_build: ${{ steps.build_context.outputs.should_build }}
      tag_exists: ${{ steps.release_state.outputs.tag_exists }}
      version: ${{ steps.build_context.outputs.version }}
    steps:
      - name: Checkout repository history
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune --tags origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          git checkout --force "${GITHUB_SHA}"

      - name: Resolve build channel and version
        id: build_context
        shell: bash
        run: |
          set -euo pipefail

          image_name="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${image_name}" >> "${GITHUB_OUTPUT}"

          case "${GITHUB_REF}" in
            refs/heads/dev)
              channel="dev"
              ;;
            refs/heads/main)
              channel="release"
              ;;
            *)
              echo "Docker publishing is restricted to the dev and main branches; received ${GITHUB_REF}." >&2
              exit 1
              ;;
          esac
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

          if [[ "${channel}" == "dev" ]]; then
            main_branch_version="$(
              git show origin/main:Dockerfile \
                | sed -n 's/^ARG APP_VERSION=//p' \
                | tail -n 1
            )"
            latest_release_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

            if [[ -n "${latest_release_tag}" ]]; then
              base_version="${latest_release_tag#v}"
              base_commit="$(git rev-list -n 1 "${latest_release_tag}")"
            else
              base_version="${main_branch_version}"
              if ! base_commit="$(git merge-base HEAD origin/main)"; then
                base_commit="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
              fi
            fi

            if [[ ! "${base_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unable to determine a valid base version for the dev image." >&2
              exit 1
            fi

            commits_since_base="$(git rev-list --count "${base_commit}..HEAD")"
            if (( commits_since_base < 1 )); then
              commits_since_base=1
            fi

            version="$(printf '%s-dev%03d' "${base_version}" "${commits_since_base}")"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          python3 .github/scripts/release_metadata.py validate
          version="$(python3 .github/scripts/release_metadata.py version)"
          previous_ref="${{ github.event.before }}"
          previous_version=""

          if [[ -n "${previous_ref}" ]] && [[ "${previous_ref}" != "0000000000000000000000000000000000000000" ]]; then
            previous_version="$(
              git show "${previous_ref}:Dockerfile" 2>/dev/null \
                | sed -n 's/^ARG APP_VERSION=//p' \
                | tail -n 1
            )"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          if [[ -n "${previous_version}" ]] && [[ "${previous_version}" == "${version}" ]]; then
            echo "Release version is unchanged at ${version}; skipping the main-branch publish."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -n "${previous_version}" ]]; then
            highest_version="$(printf '%s\n%s\n' "${previous_version}" "${version}" | sort -V | tail -n 1)"
            if [[ "${highest_version}" != "${version}" ]]; then
              echo "Release version must increase on main pushes (${previous_version} -> ${version} is invalid)." >&2
              exit 1
            fi
          fi

          echo "should_build=true" >> "${GITHUB_OUTPUT}"

      - name: Check existing release state
        id: release_state
        if: steps.build_context.outputs.channel == 'release' && steps.build_context.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build_context.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          tag_name="v${VERSION}"
          git fetch --tags origin

          if gh release view "${tag_name}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag_name} already exists; no image or desktop rebuild is required."
            echo "release_exists=true" >> "${GITHUB_OUTPUT}"
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "release_exists=false" >> "${GITHUB_OUTPUT}"

          if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "refs/tags/${tag_name}")"
            if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${tag_name} already exists on ${tag_commit}, expected ${GITHUB_SHA}." >&2
              exit 1
            fi
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true' && needs.prepare.outputs.release_exists != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }} image by digest
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            FFMPEG_PACKAGE_VERSION=7:5.1.9-0+deb12u1
            FFMPEG_PACKAGE_SHA256_AMD64=2ba8ead87657c123ce6de2de5ecdbc1fb4ead9a4b317b85b8ec41e16c890fe01
            FFMPEG_PACKAGE_SHA256_ARM64=7890aeb19a94d73e5d9281afa5ca07005804c1fca4f10791f4f2ce0df741b610
          outputs: type=image,name=${{ needs.prepare.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_name }}:buildcache-${{ needs.prepare.outputs.channel }}-${{ matrix.architecture }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_name }}:buildcache-${{ needs.prepare.outputs.channel }}-${{ matrix.architecture }},mode=max

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish_manifest:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform image manifest
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          digest_args=()
          while IFS= read -r digest_file; do
            digest_args+=("${IMAGE_NAME}@sha256:$(basename "${digest_file}")")
          done < <(find "${RUNNER_TEMP}/digests" -type f | sort)

          if [[ "${#digest_args[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digest_args[@]}." >&2
            exit 1
          fi

          if [[ "${CHANNEL}" == "dev" ]]; then
            tag_args=(
              --tag "${IMAGE_NAME}:dev"
              --tag "${IMAGE_NAME}:${VERSION}"
            )
          else
            tag_args=(
              --tag "${IMAGE_NAME}:latest"
              --tag "${IMAGE_NAME}:${VERSION}"
            )
          fi

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Verify published platforms
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          inspection="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}")"
          echo "${inspection}"
          grep -q 'linux/amd64' <<< "${inspection}"
          grep -q 'linux/arm64' <<< "${inspection}"

  finalize_release:
    needs:
      - prepare
      - publish_manifest
    if: needs.prepare.outputs.channel == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune --tags origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          git checkout --force "${GITHUB_SHA}"

      - name: Extract release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: python3 .github/scripts/release_metadata.py release-notes --version "${VERSION}" > release-notes.md

      - name: Create annotated git tag
        if: needs.prepare.outputs.tag_exists != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" "${GITHUB_SHA}" -m "MediaLyze v${VERSION}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MediaLyze v${VERSION}" \
            --notes-file release-notes.md

      - name: Trigger desktop release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          gh workflow run build-desktop.yaml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f build_type=release \
            -f tag_name="v${VERSION}"

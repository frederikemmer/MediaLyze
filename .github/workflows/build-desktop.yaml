name: build desktop artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build downloadable dev artifacts or attach assets to an existing release
        required: true
        default: dev
        type: choice
        options:
          - dev
          - release
      tag_name:
        description: Release tag, for example v0.16.3. Required only for a release build.
        required: false
        type: string
      code_ref:
        description: Optional Git ref to build. Dev builds default to the selected workflow branch; release builds default to the tag.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build_desktop:
    env:
      IS_RELEASE_BUILD: ${{ github.event_name == 'release' || inputs.build_type == 'release' }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
      BUILD_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.code_ref || (inputs.build_type == 'release' && inputs.tag_name) || github.sha }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_suffix: linux
            asset: dist/desktop-app/MediaLyze.AppImage
            os: ubuntu-latest
          - artifact_suffix: macos
            asset: dist/desktop-app/MediaLyze-arm64.dmg
            os: macos-latest
          - artifact_suffix: windows
            asset: dist/desktop-app/MediaLyze.Setup.exe
            os: windows-latest

    steps:
      - name: Validate build request
        shell: bash
        run: |
          if [[ "${IS_RELEASE_BUILD}" == "true" ]] && [[ -z "${RELEASE_TAG}" ]]; then
            echo "A release build requires a tag_name input." >&2
            exit 1
          fi

      - name: Checkout repository
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune --tags origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          git checkout --force "${BUILD_REF}" || git checkout --force "origin/${BUILD_REF}"

      - name: Resolve shared build version
        shell: bash
        run: |
          repository_version="$(python3 .github/scripts/release_metadata.py version)"
          if [[ "${IS_RELEASE_BUILD}" == "true" ]]; then
            build_version="${RELEASE_TAG#v}"
          else
            build_version="${repository_version}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "BUILD_VERSION=${build_version}" >> "${GITHUB_ENV}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate release metadata
        if: env.IS_RELEASE_BUILD == 'true'
        run: python .github/scripts/release_metadata.py validate --tag-ref "refs/tags/${{ env.RELEASE_TAG }}"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.BUILD_VERSION }}

      - name: Install backend build dependencies
        run: python -m pip install -e . pyinstaller

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Stamp Electron package version
        shell: bash
        run: npm version "${BUILD_VERSION}" --no-git-tag-version --allow-same-version
        working-directory: desktop

      - name: Run desktop packaging regression tests
        run: npm test
        working-directory: desktop

      - name: Verify shared build version inputs
        shell: bash
        run: |
          frontend_version="$(python3 -c 'import json; print(json.load(open("frontend/dist/build-version.json"))["version"])')"
          desktop_version="$(node -p 'require("./desktop/package.json").version')"
          if [[ "${frontend_version}" != "${BUILD_VERSION}" ]] || [[ "${desktop_version}" != "${BUILD_VERSION}" ]]; then
            echo "Desktop build version mismatch: expected=${BUILD_VERSION} frontend=${frontend_version} electron=${desktop_version}" >&2
            exit 1
          fi

      - name: Restore static Linux ffprobe
        if: matrix.os == 'ubuntu-latest'
        id: linux_ffprobe_cache
        uses: actions/cache@v4
        with:
          path: dist/ffprobe-bundle/ffprobe
          key: linux-static-ffprobe-v1-${{ hashFiles('desktop/scripts/build-linux-static-ffprobe.sh') }}

      - name: Install static ffprobe build tools
        if: matrix.os == 'ubuntu-latest' && steps.linux_ffprobe_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl nasm pkg-config xz-utils musl-tools binutils

      - name: Build static ffprobe on Linux
        if: matrix.os == 'ubuntu-latest' && steps.linux_ffprobe_cache.outputs.cache-hit != 'true'
        run: desktop/scripts/build-linux-static-ffprobe.sh

      - name: Validate restored Linux ffprobe
        if: matrix.os == 'ubuntu-latest' && steps.linux_ffprobe_cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          chmod +x dist/ffprobe-bundle/ffprobe
          dist/ffprobe-bundle/ffprobe -version >/dev/null
          if readelf -d dist/ffprobe-bundle/ffprobe | grep -q '(NEEDED)'; then
            echo "Cached ffprobe is dynamically linked; expected a static binary." >&2
            exit 1
          fi

      - name: Install ffmpeg on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install ffmpeg
          mkdir -p dist/ffprobe-bundle
          cp "$(command -v ffprobe)" dist/ffprobe-bundle/ffprobe

      - name: Bundle ffprobe on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist/ffprobe-bundle | Out-Null
          $ffprobeTarget = Join-Path $PWD "dist/ffprobe-bundle/ffprobe.exe"

          $existingFfprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
          if ($null -ne $existingFfprobe) {
            Copy-Item $existingFfprobe.Source $ffprobeTarget -Force
            exit 0
          }

          $archivePath = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials"

          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile $archivePath `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 5

          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }

          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

          $downloadedFfprobe = Get-ChildItem -Path $extractPath -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if ($null -eq $downloadedFfprobe) {
            throw "Unable to locate ffprobe.exe in downloaded FFmpeg archive."
          }

          Copy-Item $downloadedFfprobe.FullName $ffprobeTarget -Force

      - name: Build backend sidecar
        run: node ./scripts/build-backend.mjs
        working-directory: desktop
        env:
          MEDIALYZE_FFPROBE_DIR: ${{ github.workspace }}/dist/ffprobe-bundle

      - name: Smoke-test bundled FFmpeg capability
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            suffix=".exe"
          fi
          ffmpeg_bin="dist/desktop-backend/ffmpeg/ffmpeg${suffix}"
          ffprobe_bin="dist/desktop-backend/ffprobe/ffprobe${suffix}"
          test -f "${ffmpeg_bin}"
          test -f "${ffprobe_bin}"
          "${ffmpeg_bin}" -hide_banner -version >/dev/null
          "${ffmpeg_bin}" -hide_banner -encoders >/dev/null
          "${ffprobe_bin}" -hide_banner -version >/dev/null
          "${ffmpeg_bin}" -hide_banner -loglevel error -f lavfi -i color=c=black:s=64x64:d=0.1 -frames:v 1 -c:v mpeg4 -f null -

      - name: Build desktop artifacts
        if: matrix.os != 'windows-latest'
        run: npm run dist -- --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build desktop artifacts on Windows with retry
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          $ErrorActionPreference = "Stop"
          $maxAttempts = 3

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Windows desktop build attempt $attempt of $maxAttempts"

            npm run dist -- --publish never
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -ge $maxAttempts) {
              throw "Windows desktop build failed after $maxAttempts attempts."
            }

            Write-Warning "Windows desktop build failed on attempt $attempt with exit code $LASTEXITCODE. Retrying after 15 seconds."
            Start-Sleep -Seconds 15
          }

      - name: Verify desktop artifact name
        env:
          EXPECTED_ASSET: ${{ matrix.asset }}
        shell: bash
        run: |
          if [[ ! -f "${EXPECTED_ASSET}" ]]; then
            echo "Expected desktop artifact not found: ${EXPECTED_ASSET}" >&2
            echo "Available files:" >&2
            ls -la dist/desktop-app >&2
            exit 1
          fi

      - name: Verify Linux AppImage ffprobe bundle
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          appimage="dist/desktop-app/MediaLyze.AppImage"
          chmod +x "$appimage"
          rm -rf squashfs-root
          "$appimage" --appimage-extract >/dev/null

          ffprobe_dir="squashfs-root/resources/backend/ffprobe"
          ffprobe_bin="$ffprobe_dir/ffprobe"
          ffmpeg_dir="squashfs-root/resources/backend/ffmpeg"
          ffmpeg_bin="$ffmpeg_dir/ffmpeg"

          if [[ ! -x "$ffprobe_bin" ]]; then
            echo "Bundled ffprobe executable is missing from AppImage: $ffprobe_bin" >&2
            exit 1
          fi

          if [[ ! -x "$ffmpeg_bin" ]]; then
            echo "Bundled ffmpeg executable is missing from AppImage: $ffmpeg_bin" >&2
            exit 1
          fi

          if [[ -e "$ffprobe_dir/ffprobe-medialyze" ]]; then
            echo "Linux AppImage must not bundle the old ffprobe wrapper." >&2
            exit 1
          fi

          if find "$ffprobe_dir" -type f -name 'libav*.so*' | grep -q .; then
            echo "Linux AppImage must not bundle dynamic FFmpeg shared libraries." >&2
            find "$ffprobe_dir" -type f -name 'libav*.so*' >&2
            exit 1
          fi

          if readelf -d "$ffprobe_bin" | grep -q '(NEEDED)'; then
            echo "Bundled ffprobe is dynamically linked; expected static binary." >&2
            readelf -d "$ffprobe_bin" >&2
            exit 1
          fi

          "$ffprobe_bin" -version >/dev/null
          "$ffmpeg_bin" -hide_banner -version >/dev/null
          "$ffmpeg_bin" -hide_banner -encoders >/dev/null
          "$ffmpeg_bin" -hide_banner -loglevel error -f lavfi -i color=c=black:s=64x64:d=0.1 -frames:v 1 -c:v mpeg4 -f null -

          python3 - <<'PY'
          import wave
          from pathlib import Path

          path = Path("dist/ffprobe-smoke.wav")
          with wave.open(str(path), "w") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(8000)
              wav.writeframes(b"\x00\x00" * 8000)
          PY

          "$ffprobe_bin" -v error -print_format json -show_format -show_streams dist/ffprobe-smoke.wav >/tmp/ffprobe-smoke.json
          grep -q '"codec_name": "pcm_s16le"' /tmp/ffprobe-smoke.json

      - name: Upload desktop workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: medialyze-desktop-${{ matrix.artifact_suffix }}-${{ env.IS_RELEASE_BUILD == 'true' && 'release' || 'dev' }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload desktop asset to GitHub release
        if: env.IS_RELEASE_BUILD == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "${{ matrix.asset }}" --clobber

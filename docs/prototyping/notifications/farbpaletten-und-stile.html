  <script>
    const paletteDefinitions={
      medialyze:{name:"MediaLyze",colors:{success:["#1b806f","#e4f4ef"],info:["#3f51b5","#eef0fb"],warning:["#9b6b1f","#fff2d8"],error:["#a43e2b","#fff0eb"]},dark:{success:["#8bd3c0","rgba(27,128,111,.20)"],info:["#b7bffc","rgba(63,81,181,.24)"],warning:["#e9c27d","rgba(155,107,31,.24)"],error:["#ffad96","rgba(164,62,43,.24)"]}},
      soft:{name:"Sanft & ruhig",colors:{success:["#477868","#e9f2ed"],info:["#54748c","#edf2f4"],warning:["#967341","#f5f0e3"],error:["#966052","#f5eeeb"]},dark:{success:["#a5d1bd","rgba(71,120,104,.23)"],info:["#a9c9dc","rgba(84,116,140,.24)"],warning:["#e2c996","rgba(150,115,65,.24)"],error:["#ddb0a3","rgba(150,96,82,.24)"]}},
      contrast:{name:"Klar & kontrastreich",colors:{success:["#145c43","#dceee5"],info:["#2055a0","#e2eafa"],warning:["#704808","#faedca"],error:["#942f28","#f9e6e3"]},dark:{success:["#80dbad","rgba(20,92,67,.28)"],info:["#91b9ff","rgba(32,85,160,.30)"],warning:["#f2c45b","rgba(112,72,8,.30)"],error:["#ff9a8d","rgba(148,47,40,.30)"]}}
    };
    const types={success:{label:"Erfolg",message:"Verbindung zu Wohnzimmer-Server erfolgreich getestet.",mark:"✓"},info:{label:"Info",message:"Synchronisierung für Wohnzimmer-Server wurde gestartet.",mark:"i"},warning:{label:"Warnung",message:"Bitte prüfe die Zugangsdaten für Wohnzimmer-Server.",mark:"!"},error:{label:"Fehler",message:"Der Verbindungstest für Wohnzimmer-Server ist fehlgeschlagen.",mark:"×"}};
    const state={palette:"medialyze",style:"outline",duration:2500,entryMotion:"rise",notifications:[],nextId:1,pauseSources:new Set(),enteringIds:new Set()};
    const testTopics=[
      {topic:"transcoding-314",topicLabel:"Transcoding · Job #314",subject:"Job #314",href:"#/transcoding/jobs/314",target:"transcoding"},
      {topic:"transcoding-927",topicLabel:"Transcoding · Job #927",subject:"Job #927",href:"#/transcoding/jobs/927",target:"transcoding"},
      {topic:"scan-movies",topicLabel:"Bibliothek · Movies",subject:"Scan Movies",library:"Movies",href:"#/settings/libraries/movies",target:"library"},
      {topic:"scan-series",topicLabel:"Bibliothek · Serien",subject:"Scan Serien",library:"Serien",href:"#/settings/libraries/series",target:"library"},
      {topic:"scan-music",topicLabel:"Bibliothek · Musik",subject:"Scan Musik",library:"Musik",href:"#/settings/libraries/music",target:"library"},
      {topic:"scan-books",topicLabel:"Bibliothek · Hörbücher",subject:"Scan Hörbücher",library:"Hörbücher",href:"#/settings/libraries/audiobooks",target:"library"}
    ];
    const testMessage={success:subject=>`${subject} wurde erfolgreich abgeschlossen.`,info:subject=>`${subject} wurde gestartet.`,warning:subject=>`${subject} benötigt Aufmerksamkeit.`,error:subject=>`${subject} ist fehlgeschlagen.`};
    function allTestEvents(){return testTopics.flatMap(topic=>Object.keys(types).map(type=>({...topic,type,message:testMessage[type](topic.subject)})))}
    function shuffled(items){const result=[...items];for(let index=result.length-1;index>0;index--){const other=Math.floor(Math.random()*(index+1));[result[index],result[other]]=[result[other],result[index]]}return result}
    const settingsNavigationGroups=[
      {label:"Libraries & Quellen",items:[{id:"configuredLibraries",label:"Libraries",icon:`<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"`},{id:"jellyfin",label:"Connectoren",icon:`<rect width="20" height="8" x="2" y="3" rx="2"/><rect width="20" height="8" x="2" y="13" rx="2"/><path d="M6 7h.01M6 17h.01"`}]},
      {label:"Analyse",items:[{id:"qualityProfiles",label:"Quality-Profile",icon:`<path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3"/><path d="M2 14h4m4-6h4m4 8h4"`},{id:"compatibilityProfiles",label:"Hard-/Software-Profile",icon:`<rect width="16" height="16" x="4" y="4" rx="2"/><path d="M9 9h6v6H9zM9 1v3m6-3v3m0 16v3m-6-3v3M1 9h3m-3 6h3m16-6h3m-3 6h3"`},{id:"patternRecognition",label:"Pattern recognition",icon:`<path d="M12 3 4 6v5c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6z"/><circle cx="12" cy="11" r="2.5"/><path d="M12 13.5V17"`}]},
      {label:"Anwendung",items:[{id:"accounts",label:"Nutzer & Zugriffe",icon:`<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="m16 11 2 2 4-4"`},{id:"appSettings",label:"App-Einstellungen",icon:`<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1-1.6 2.7-.2-.1a2 2 0 0 0-2 .3l-.1.1h-3.2l-.1-.2a2 2 0 0 0-1.7-1.1h-.2l-1.6-2.7.1-.2a2 2 0 0 0 0-1.9l-.1-.2 1.6-2.7h.2a2 2 0 0 0 1.7-1.2l.1-.2h3.2l.1.1a2 2 0 0 0 2 .3l.2-.1 1.6 2.7-.1.1a2 2 0 0 0-.1 2.1Z"`},{id:"transcoding",label:"Transcoding",icon:`<path d="M22 12h-4l-3 9L9 3l-3 9H2"`},{id:"transcodingPresets",label:"Transcoding-Presets",icon:`<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"`}]},
      {label:"Wartung & Diagnose",items:[{id:"historyRetention",label:"Verlaufsaufbewahrung",icon:`<path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5m4-1v5l3 2"`},{id:"recentScanLogs",label:"Letzte Scan-Logs",icon:`<path d="M4 4h16v16H4z"/><path d="M8 8h8m-8 4h8m-8 4h5"`},{id:"telemetry",label:"Telemetry",icon:`<path d="M3 12h3l3-8 5 16 3-8h4"`}]}
    ];
    function settingsNavIcon(path){return `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`}
    function renderSettingsNavigation(){const markup=settingsNavigationGroups.map(group=>`<div class="settings-navigation-group"><div class="settings-navigation-group-label">${group.label}</div>${group.items.map(item=>`<button class="settings-navigation-item${item.id==="appSettings"?" active":""}" type="button" data-settings-item="${item.id}" title="${item.label}"${item.id==="appSettings"?' aria-current="page"':''}>${item.id==="appSettings"?'<span class="nav-active-pill" aria-hidden="true"></span>':""}<span class="settings-navigation-item-content">${settingsNavIcon(item.icon)}<span>${item.label}</span></span></button>`).join("")}</div>`).join("");document.getElementById("settings-navigation-list").innerHTML=markup;document.getElementById("settings-mobile-navigation-list").innerHTML=markup}
    function filterSettingsNavigation(query){const normalized=query.trim().toLocaleLowerCase("de");document.querySelectorAll(".settings-navigation-list,.settings-mobile-navigation-list").forEach(list=>{list.querySelectorAll(".settings-navigation-group").forEach(group=>{let visible=0;group.querySelectorAll(".settings-navigation-item").forEach(item=>{const match=!normalized||item.textContent.toLocaleLowerCase("de").includes(normalized);item.hidden=!match;if(match)visible++});group.hidden=visible===0})})}
    function syncSettingsSearch(source){const other=document.getElementById(source.id==="settings-search"?"settings-search-mobile":"settings-search");other.value=source.value;filterSettingsNavigation(source.value)}
    renderSettingsNavigation();
    function colorsForPalette(key,type){const palette=paletteDefinitions[key];return document.documentElement.dataset.theme==="dark"?palette.dark[type]:palette.colors[type]}
    function colorsFor(type){return colorsForPalette(state.palette,type)}
    const MAX_COLLAPSED_CARDS=5,NOTICE_CARD_HEIGHT=42,NOTICE_STACK_OFFSET=5,NOTICE_FAN_GAP=4;
    function groupKey(item){const mode=document.getElementById("grouping-mode").value;if(mode==="off")return `item-${item.id}`;if(mode==="topic")return `topic-${item.topic}`;if(mode==="type")return `type-${item.type}`;return `both-${item.topic}-${item.type}`}
    function groupedNotifications(){const groups=new Map();state.notifications.forEach(item=>{const key=groupKey(item);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item)});return [...groups.entries()].map(([key,items])=>({key,items,latest:items[items.length-1]})).reverse()}
    function arrowLink(item){return `<a class="source-link" href="${item.href}" data-target="${item.target}" data-topic-label="${escapeHtml(item.topicLabel)}" data-library="${escapeHtml(item.library||"")}" title="${types[item.type].label}: ${item.topicLabel} öffnen" aria-label="${types[item.type].label}: ${item.topicLabel} öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>`}
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\'":"&#39;"}[char]))}
    function formatNotificationMessage(value){return escapeHtml(value).replace(/\bJob\s+#\d+\b/gi,reference=>`<span class="notice-reference">${reference}</span>`)}
    function areaIconMarkup(target){const paths={transcoding:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/>',library:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',connector:'<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/>'};return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +(paths[target]||paths.connector)+'</svg>'}
    function groupMarkup(group){const {items}=group;const cards=[...items].reverse();const visibleCount=Math.min(cards.length,MAX_COLLAPSED_CARDS),fanStep=NOTICE_CARD_HEIGHT+NOTICE_FAN_GAP,fanHeight=NOTICE_CARD_HEIGHT+(cards.length-1)*fanStep,stackHeight=NOTICE_CARD_HEIGHT+(visibleCount-1)*NOTICE_STACK_OFFSET,fanViewportHeight=NOTICE_CARD_HEIGHT+(MAX_COLLAPSED_CARDS-1)*fanStep,hasOverflow=cards.length>MAX_COLLAPSED_CARDS;return `<div class="notice-deck" data-overflow="${hasOverflow}" ${hasOverflow?'tabindex="0"':''} role="group" aria-label="${cards.length} Benachrichtigungen" style="--stack-height:${stackHeight}px;--fan-height:${fanHeight}px;--fan-viewport-height:${fanViewportHeight}px">${cards.map((item,index)=>`<article class="notice-group${state.enteringIds.has(item.id)?" is-entering":""}" data-notification-id="${item.id}" data-entry-motion="${state.entryMotion}" data-style="${state.style}" data-type="${item.type}" style="--notice-color:${colorsFor(item.type)[0]};--notice-bg:${colorsFor(item.type)[1]};--stack-top:calc(100% - ${NOTICE_CARD_HEIGHT+index*NOTICE_STACK_OFFSET}px);--fan-top:${index*fanStep}px;--fan-delay:${Math.min(index,MAX_COLLAPSED_CARDS-1)*18}ms;--entry-delay:${Math.min(index,MAX_COLLAPSED_CARDS-1)*28}ms;z-index:${cards.length-index}"><span class="notice-area-icon" aria-hidden="true">${areaIconMarkup(item.target)}</span><span class="notice-copy">${formatNotificationMessage(item.message)}</span>${arrowLink(item)}</article>`).join("")}</div>`}
    function pauseAllNotifications(){state.notifications.forEach(item=>{if(item.paused)return;if(item.timer){clearTimeout(item.timer);item.timer=null}item.remaining=Math.max(0,(item.expiresAt??Date.now()+state.duration)-Date.now());item.paused=true})}
    function resumeAllNotifications(){state.notifications.forEach(item=>{if(!item.paused)return;item.paused=false;scheduleExpiry(item)})}
    function setPauseSource(source,active){const wasPaused=state.pauseSources.size>0;if(active)state.pauseSources.add(source);else state.pauseSources.delete(source);const isPaused=state.pauseSources.size>0;if(!wasPaused&&isPaused)pauseAllNotifications();else if(wasPaused&&!isPaused)resumeAllNotifications()}
    function scheduleExpiry(item){if(item.paused)return;item.expiresAt=Date.now()+(item.remaining??state.duration);item.timer=setTimeout(()=>{state.notifications=state.notifications.filter(entry=>entry.id!==item.id);state.enteringIds.delete(item.id);renderNotifications()},item.remaining??state.duration)}
    function renderNotifications(){const stack=document.getElementById("toast-stack");const groups=groupedNotifications();stack.dataset.entryMotion=state.entryMotion;stack.innerHTML=groups.map(groupMarkup).join("");groups.forEach((group,index)=>{if(stack.children[index])stack.children[index].dataset.groupKey=group.key})}
    function createNotification(event){const item={...event,id:state.nextId++,remaining:state.duration,paused:state.pauseSources.size>0};state.notifications.push(item);state.enteringIds.add(item.id);if(!item.paused)scheduleExpiry(item);renderNotifications()}
    function fireOneTest(){createNotification(shuffled(allTestEvents())[0])}
    function fireTenTests(){shuffled(allTestEvents()).slice(0,10).forEach((event,index)=>setTimeout(()=>createNotification(event),index*110))}
    function navigateToTarget(target,topicLabel,library){const settings=document.getElementById("settings-screen"),screen=document.getElementById("target-screen");settings.hidden=true;screen.hidden=false;if(target==="transcoding"){const job=(topicLabel.match(/Job #\d+/)||["Transcoding-Job"])[0];screen.innerHTML=`<button class="back-button" type="button">← Zurück zu App-Einstellungen</button><p class="eyebrow" style="margin-top:20px">Transkodierung · ${job}</p><h1>Transkodierung fehlgeschlagen</h1><p>Die Notification führt direkt zur Übersicht und zum betroffenen Job.</p><div class="target-card"><strong>${job} · Movies / Filmbeispiel.mkv</strong><span>Status: Fehler oder Warnung</span><p>Die Notification verweist direkt auf die Details des ausgewählten Testjobs.</p></div>`}else{const libraryName=library||"Movies";screen.innerHTML=`<button class="back-button" type="button">← Zurück zu App-Einstellungen</button><p class="eyebrow" style="margin-top:20px">Einstellungen · Bibliothek ${libraryName}</p><h1>Testmeldung für ${libraryName}</h1><p>Die Notification führt zu den Einstellungen der betroffenen Bibliothek.</p><div class="target-card"><strong>Bibliothek ${libraryName}</strong><span>Beispielstatus für den Scan</span><p>Die Notification verweist auf die konfigurierte Scan- und Pfadeinstellung.</p></div>`}screen.querySelector(".back-button").addEventListener("click",()=>{screen.hidden=true;settings.hidden=false;location.hash=""})}
    document.getElementById("palette-select").addEventListener("change",event=>{state.palette=event.target.value;renderNotifications()});document.getElementById("notification-style").addEventListener("change",event=>{state.style=event.target.value;renderNotifications()});document.getElementById("grouping-mode").addEventListener("change",renderNotifications);
    document.getElementById("duration").addEventListener("input",event=>{state.duration=Number(event.target.value)*1000;document.getElementById("duration-output").value=`${String(Number(event.target.value)).replace(".",",")} Sek.`;state.notifications.forEach(item=>{if(item.timer)clearTimeout(item.timer);item.timer=null;item.remaining=state.duration;item.paused=state.pauseSources.size>0;if(!item.paused)scheduleExpiry(item)});renderNotifications()});
    document.getElementById("fire-one").addEventListener("click",fireOneTest);document.getElementById("fire-ten").addEventListener("click",fireTenTests);
    document.getElementById("clear-all").addEventListener("click",()=>{state.notifications.forEach(item=>clearTimeout(item.timer));state.notifications=[];state.enteringIds.clear();renderNotifications()});
    document.getElementById("toast-stack").addEventListener("click",event=>{const link=event.target.closest("a[data-target]");if(!link)return;event.preventDefault();location.hash=link.getAttribute("href");navigateToTarget(link.dataset.target,link.dataset.topicLabel,link.dataset.library)});
    const stack=document.getElementById("toast-stack");stack.addEventListener("animationstart",event=>{const card=event.target.closest(".notice-group.is-entering");if(card)state.enteringIds.delete(Number(card.dataset.notificationId))});let pointerResumeTimer=null;stack.addEventListener("pointerover",event=>{if(pointerResumeTimer){clearTimeout(pointerResumeTimer);pointerResumeTimer=null}if(!stack.contains(event.relatedTarget))setPauseSource("pointer",true)});stack.addEventListener("pointerout",event=>{if(stack.contains(event.relatedTarget))return;if(pointerResumeTimer)clearTimeout(pointerResumeTimer);pointerResumeTimer=setTimeout(()=>{pointerResumeTimer=null;setPauseSource("pointer",false)},80)});stack.addEventListener("focusin",()=>setPauseSource("focus",true));stack.addEventListener("focusout",event=>{if(!stack.contains(event.relatedTarget))setPauseSource("focus",false)});
    renderNotifications();
  </script>
</body>
</html>

services:
  medialyze:
    # Hardware acceleration setup:
    # - Recommended: start with ./start-medialyze.sh on Linux/macOS or
    #   .\start-medialyze.ps1 on Windows. The launcher detects NVIDIA and
    #   Linux /dev/dri access and creates a temporary GPU override.
    # - Linux AMD/Intel: this also covers Intel CPU/iGPU Quick Sync and AMD
    #   APU/iGPU VCN. The host must have its kernel GPU driver loaded and
    #   expose /dev/dri. The launcher forwards the numeric render/video group
    #   IDs automatically, including for non-root PUID/PGID containers.
    # - NVIDIA: the host needs a working NVIDIA driver, nvidia-smi, and a
    #   Docker GPU runtime. The launcher adds gpus: all when reachable.
    # - Native Windows AMD/Intel and native macOS Apple VideoToolbox use the
    #   desktop build. Docker Desktop's Linux VM cannot expose those native
    #   APIs; Docker acceleration there is limited to what the VM passes through.
    # - If you invoke `docker compose up` directly, provide the host GPU
    #   devices/groups yourself. MediaLyze cannot install host drivers.
    image: ghcr.io/frederikemmer/medialyze:latest
    container_name: medialyze
    hostname: medialyze
    ports:
      - "${HOST_PORT:-8080}:8080"
      # Direct transcode federation protocol and optional LAN discovery.
      - "${FEDERATION_HOST_PORT:-8091}:${MEDIALYZE_FEDERATION_PORT:-8091}/tcp"
      - "${FEDERATION_DISCOVERY_PORT:-43211}:${MEDIALYZE_FEDERATION_DISCOVERY_PORT:-43211}/udp"
    environment:
      # change to your timezone, e.g. "Europe/Berlin" or "America/New_York"
      TZ: ${TZ:-UTC}
      CONFIG_PATH: /config
      MEDIA_ROOT: /media
      MEDIALYZE_TRANSCODE_OUTPUT_ROOT: /transcode-output
      MEDIALYZE_FEDERATION_ENABLED: ${MEDIALYZE_FEDERATION_ENABLED:-true}
      MEDIALYZE_FEDERATION_HOST: ${MEDIALYZE_FEDERATION_HOST:-0.0.0.0}
      MEDIALYZE_FEDERATION_PORT: ${MEDIALYZE_FEDERATION_PORT:-8091}
      MEDIALYZE_FEDERATION_DISCOVERY_PORT: ${MEDIALYZE_FEDERATION_DISCOVERY_PORT:-43211}
      MEDIALYZE_FEDERATION_PASSCODE: ${MEDIALYZE_FEDERATION_PASSCODE:-}
      MEDIALYZE_FEDERATION_ADVERTISE_URLS: ${MEDIALYZE_FEDERATION_ADVERTISE_URLS:-}
      MEDIALYZE_FEDERATION_CHUNK_SIZE_BYTES: ${MEDIALYZE_FEDERATION_CHUNK_SIZE_BYTES:-1048576}
      MEDIALYZE_FEDERATION_TEMP_BUDGET_BYTES: ${MEDIALYZE_FEDERATION_TEMP_BUDGET_BYTES:-0}
      MEDIALYZE_FEDERATION_RESULT_RETENTION_HOURS: ${MEDIALYZE_FEDERATION_RESULT_RETENTION_HOURS:-24}
      MEDIALYZE_FEDERATION_REQUEST_TIMEOUT_SECONDS: ${MEDIALYZE_FEDERATION_REQUEST_TIMEOUT_SECONDS:-15}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    volumes:
      - ${CONFIG_HOST_DIR:-./config}:/config
      - ${MEDIA_HOST_DIR:-./media}:/media:ro
      - ${TRANSCODE_OUTPUT_HOST_DIR:-./Transcode_Output}:/transcode-output:rw

      # additional media mounts are managed as:
      # /PATH/TO/MEDIA1:/media/MEDIA1:ro
      # /PATH/TO/MEDIA2:/media/MEDIA2:ro
